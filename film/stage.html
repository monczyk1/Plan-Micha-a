<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#0c0e0d}
body{font-family:'IBM Plex Sans',sans-serif;color:#e8ebe9;position:relative}
#bg{position:absolute;inset:0;background:radial-gradient(900px 700px at 50% 62%,rgba(249,115,22,.16),transparent 70%),radial-gradient(700px 500px at 85% 8%,rgba(249,115,22,.08),transparent 70%),#0c0e0d}
#grid{position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(circle at 50% 50%,#000 30%,transparent 80%)}
#prog{position:absolute;left:0;top:0;height:8px;background:#f97316;width:0}
/* captions */
#caps{position:absolute;left:0;right:0;top:70px;height:290px}
.cap{position:absolute;left:80px;right:80px;top:0}
.cap .k{font-family:'IBM Plex Mono',monospace;font-weight:500;font-size:30px;color:#f97316;letter-spacing:.12em}
.cap .h{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:104px;line-height:.95;text-transform:uppercase;letter-spacing:.01em;margin-top:8px}
.cap .s{font-size:38px;line-height:1.3;color:#b9c2bd;margin-top:16px}
/* phone */
#phone{position:absolute;left:182px;top:378px;width:716px;height:1510px;border-radius:96px;background:#050606;box-shadow:0 0 0 3px #2b302e,0 0 0 9px #111413,0 40px 120px rgba(0,0,0,.7),0 0 160px rgba(249,115,22,.12);transform-origin:50% 100%}
#screen{position:absolute;left:18px;top:18px;width:393px;height:852px;transform:scale(1.730279898);transform-origin:0 0;border-radius:45px;overflow:hidden;background:#141716}
#cam{position:absolute;left:0;top:0;width:393px;height:852px;transform-origin:0 0}
.scr{position:absolute;left:0;top:0;width:393px;height:852px;display:none;overflow:hidden}
.scr>img.full{position:absolute;left:0;top:0;width:393px;height:852px}
#fx{position:absolute;left:0;top:0;width:393px;height:852px;z-index:10}
#S_f1 img.full{clip-path:inset(0 0 472px 0)}
.tap{position:absolute;width:0;height:0}
.tap .dot{position:absolute;left:-21px;top:-21px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.55);border:2px solid #fff;box-shadow:0 0 18px rgba(0,0,0,.5)}
.tap .ring{position:absolute;left:-21px;top:-21px;width:42px;height:42px;border-radius:50%;border:3px solid #f97316}
.hl{position:absolute;border:3px solid #f97316;border-radius:14px;box-shadow:0 0 0 4px rgba(249,115,22,.25),0 0 30px rgba(249,115,22,.5)}
/* title & end */
.center{position:absolute;left:0;right:0;text-align:center}
#title,#end{position:absolute;inset:0}
.bigicon{width:300px;height:300px;border-radius:68px;box-shadow:0 30px 90px rgba(249,115,22,.35),0 0 0 2px rgba(255,255,255,.08)}
.bt{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:140px;letter-spacing:.02em;line-height:1}
.bs{font-size:44px;color:#b9c2bd}
.chips{display:flex;flex-direction:column;gap:22px;align-items:center}
.chip{font-size:40px;padding:18px 36px;border-radius:999px;background:#1d2120;border:2px solid #2e3432}
.chip b{color:#f97316}
#droid{position:absolute;left:90px;right:90px;top:1500px;background:#1d2120;border:3px solid #f97316;border-radius:36px;padding:34px 40px;box-shadow:0 30px 80px rgba(0,0,0,.7)}
#droid .t{font-family:'IBM Plex Mono',monospace;color:#f97316;font-size:28px;letter-spacing:.12em}
#droid .b{font-size:44px;margin-top:10px;line-height:1.3}
/* iOS mock (inside screen coords 393x852) */
.ios{font-family:-apple-system,'IBM Plex Sans',sans-serif;color:#fff}
.sbar{position:absolute;left:0;right:0;top:0;height:50px;display:flex;align-items:center;justify-content:space-between;padding:6px 30px 0 40px;font-weight:600;font-size:16px;z-index:5}
.island{position:absolute;left:50%;top:11px;width:120px;height:35px;margin-left:-60px;background:#000;border-radius:20px;z-index:6}
.page{position:absolute;left:0;top:50px;width:393px;height:720px;overflow:hidden}
.page img{width:393px;height:852px;display:block}
.tb{position:absolute;left:0;right:0;bottom:0;height:96px;background:linear-gradient(transparent,rgba(0,0,0,.85) 30%);display:flex;align-items:center;gap:10px;padding:0 14px 22px}
.circ{width:48px;height:48px;border-radius:50%;background:rgba(60,60,64,.9);display:flex;align-items:center;justify-content:center;flex:none}
.pill{flex:1;height:48px;border-radius:24px;background:rgba(60,60,64,.9);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:16px}
.pill .u{flex:1;text-align:center}
.dim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.menu{position:absolute;left:96px;bottom:104px;width:236px;background:rgba(44,44,48,.97);border-radius:22px;padding:8px 0;transform-origin:30% 100%}
.mi{display:flex;align-items:center;gap:12px;padding:12px 18px;font-size:17px}
.mi svg{flex:none}
.sep{height:1px;background:rgba(255,255,255,.12);margin:4px 0}
.sheet{position:absolute;left:0;right:0;bottom:0;top:96px;background:#1c1c1e;border-radius:28px 28px 0 0;padding:20px 16px}
.shead{display:flex;gap:12px;align-items:center}
.shead img{width:52px;height:52px;border-radius:12px}
.shead .x{margin-left:auto;width:34px;height:34px;border-radius:50%;background:#3a3a3c;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ccc}
.acts{display:flex;gap:12px;margin:24px 0 18px}
.act{flex:1;text-align:center;font-size:12px;color:#ddd}
.act .ic{width:64px;height:64px;border-radius:18px;background:#2c2c2e;margin:0 auto 8px;display:flex;align-items:center;justify-content:center}
.list{background:#2c2c2e;border-radius:14px;overflow:hidden}
.li{display:flex;align-items:center;gap:14px;padding:14px 16px;font-size:17px;border-bottom:1px solid rgba(255,255,255,.08)}
.li:last-child{border-bottom:0}
.li.on{background:#48484a}
.dlg{position:absolute;inset:0;background:#000;padding-top:50px}
.dh{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 18px}
.dh .ttl{font-weight:600;font-size:16px}
.dh .add{background:#0a84ff;border-radius:20px;padding:9px 18px;font-weight:600;font-size:16px}
.grp{background:#1c1c1e;border-radius:14px;margin:0 14px}
.home{position:absolute;inset:0;background:radial-gradient(420px 380px at 20% 20%,#3b2a5c,transparent 70%),radial-gradient(420px 420px at 90% 70%,#7a3412,transparent 70%),radial-gradient(300px 300px at 30% 90%,#16424a,transparent 70%),#121418}
.hicon{position:absolute;left:26px;top:72px;width:64px;text-align:center}
.hicon img{width:64px;height:64px;border-radius:15px;display:block;box-shadow:0 4px 14px rgba(0,0,0,.4)}
.hicon span{display:block;font-size:11.5px;margin-top:6px;white-space:nowrap;margin-left:-20px;margin-right:-20px;text-shadow:0 1px 3px rgba(0,0,0,.6)}
.dock{position:absolute;left:12px;right:12px;bottom:12px;height:92px;border-radius:34px;background:rgba(255,255,255,.14);display:flex;justify-content:space-around;align-items:center;padding:0 10px}
.dock i{width:62px;height:62px;border-radius:15px;background:rgba(255,255,255,.22)}
.srch{position:absolute;left:50%;bottom:122px;width:92px;margin-left:-46px;height:30px;border-radius:15px;background:rgba(255,255,255,.18);font-size:13px;display:flex;align-items:center;justify-content:center;gap:4px}
</style></head><body>
<div id="bg"></div><div id="grid"></div><div id="prog"></div>
<div id="caps"></div>

<div id="phone"><div id="screen"><div id="cam">
  <div id="scrs"></div>
  <div id="fx"></div>
</div></div></div>

<div id="title">
  <div class="center" style="top:520px"><img class="bigicon" id="tIcon" src="icon.png"></div>
  <div class="center bt" id="tT" style="top:900px">TYTANOWA SIŁA</div>
  <div class="center bs" id="tS" style="top:1090px">Twój notatnik treningowy na siłownię</div>
  <div class="center" id="tS2" style="top:1180px;font-family:'IBM Plex Mono',monospace;font-size:32px;color:#f97316;letter-spacing:.14em">PRZEWODNIK · 50 SEKUND</div>
</div>
<div id="droid"><div class="t">MASZ ANDROIDA?</div><div class="b">Chrome → <b>⋮</b> → <b>Dodaj do ekranu głównego</b></div></div>
<div id="end">
  <div class="center" style="top:300px"><img class="bigicon" id="eIcon" src="icon.png"></div>
  <div class="center bt" id="eT" style="top:680px">TRENUJ. ZAPISUJ.<br><span style="color:#f97316">ROŚNIJ.</span></div>
  <div class="center chips" id="eC" style="top:1230px">
    <div class="chip"><b>✓</b> działa offline, także bez zasięgu</div>
    <div class="chip"><b>✓</b> dane zostają w Twoim telefonie</div>
    <div class="chip"><b>✓</b> kopia zapasowa jednym kliknięciem</div>
  </div>
</div>
<script src="timeline.js"></script>
</body></html>
